id: hemonc-fhir-regimen-catalog
canonical: http://hemonc.org/fhir
name: HemOncFHIRRegimenCatalog
title: HemOnc FHIR Regimen Catalog — Executable Knowledge Layer for Oncology Protocols
description: |
  FHIR R4 projection of the HemOnc Knowledge Base (HemOncKB) as executable
  knowledge artifacts (PlanDefinition, ActivityDefinition, MedicationKnowledge,
  Library, CodeSystem, ConceptMap). Companion to the German MII Onkologie module
  and aligned with the HL7 Europe PHOENIX Cancer Common Model initiative.
  Developed in cooperation with HemOnc.org / OHDSI Oncology / HL7-EU PHOENIX /
  MII Onkologie. CC BY 4.0.
status: draft
experimental: true
version: 2026-03-12-0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
license: CC-BY-4.0
jurisdiction: urn:iso:std:iso:3166#DE "Germany"

publisher:
  name: HemOnc FHIR Catalog Working Group
  url: https://github.com/thome/oncology-regimens

dependencies:
  de.medizininformatikinitiative.kerndatensatz.onkologie: 2026.0.3

parameters:
  show-inherited-invariants: false
  apply-version: true
  apply-status: true
  apply-publisher: true

