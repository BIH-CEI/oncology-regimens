id: hemonc-fhir-regimen-catalog
canonical: http://hemonc.org/fhir
name: EuropeanSACTRegimenCatalog
title: European SACT Regimen Catalog — Executable Knowledge Layer for Systemic Anti-Cancer Therapy Regimens
description: |
  FHIR R4 Implementation Guide that represents systemic anti-cancer therapy
  (SACT) regimens as executable knowledge artifacts (PlanDefinition,
  ActivityDefinition, Medication, Library, CodeSystem, ConceptMap).
  Catalog-layer companion to the HL7 Europe Cancer Common Model (PHOENIX) and
  the German MII Onkologie module. First content source: the HemOnc Knowledge
  Base (HemOncKB). Developed in cooperation with HL7 Europe PHOENIX, HemOnc.org,
  OHDSI Oncology and MII Onkologie. CC BY 4.0.
status: draft
experimental: true
version: 2026-03-12-0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
license: CC-BY-4.0
jurisdiction: urn:iso:std:iso:3166#DE "Germany"

publisher:
  name: European SACT Regimen Catalog Working Group
  url: https://github.com/thome/oncology-regimens

dependencies:
  de.medizininformatikinitiative.kerndatensatz.onkologie: 2026.0.3
  hl7.fhir.uv.extensions.r4: 5.4.0

parameters:
  show-inherited-invariants: false
  apply-version: true
  apply-status: true
  apply-publisher: true

